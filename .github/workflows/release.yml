name: Release asset

# Attaches webasto_cool_top_trail.zip to every published release. HACS and the
# Home Assistant Marketplace install from that asset (zip_release in hacs.json),
# and its GitHub download count is the count they show.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach the ZIP to, like v1.1.3
        required: true

permissions:
  contents: write

concurrency:
  group: release-asset-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  zip:
    name: Build and attach integration ZIP
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Check tag and manifest version
        run: |
          VERSION="$(python -c 'import json; print(json.load(open("custom_components/webasto_cool_top_trail/manifest.json"))["version"])')"
          if [ "${TAG}" != "v${VERSION}" ]; then
            echo "::error::Tag ${TAG} does not match manifest version v${VERSION}"
            exit 1
          fi

      - name: Build integration ZIP
        run: |
          # HACS and the Marketplace extract the ZIP straight into
          # custom_components/webasto_cool_top_trail/, so the files go at the ZIP root.
          cd custom_components/webasto_cool_top_trail
          zip -r ../../webasto_cool_top_trail.zip . -x "*__pycache__*" "*.pyc"
          cd ../..
          python - <<'PY'
          import json
          import zipfile

          with zipfile.ZipFile("webasto_cool_top_trail.zip") as archive:
              names = archive.namelist()
              manifest = json.loads(archive.read("manifest.json"))
          if manifest["domain"] != "webasto_cool_top_trail":
              raise SystemExit(f"Unexpected domain {manifest['domain']}")
          if any(name.startswith("webasto_cool_top_trail/") for name in names):
              raise SystemExit("ZIP must not hold a webasto_cool_top_trail/ folder")
          if "brand/icon.png" not in names:
              raise SystemExit("ZIP is missing brand/icon.png")
          print(f"webasto_cool_top_trail.zip: {len(names)} entries, manifest at the root")
          PY

      - name: Attach ZIP to the release
        run: |
          # Replacing an attached asset would reset its download count
          if gh release view "${TAG}" --json assets --jq '.assets[].name' | grep -qx webasto_cool_top_trail.zip; then
            echo "webasto_cool_top_trail.zip is already attached to ${TAG}"
            exit 0
          fi
          gh release upload "${TAG}" webasto_cool_top_trail.zip
