name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and formatting
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - run: python -m pip install ruff==0.17.2
      - run: ruff check .
      - run: ruff format --check .

  tests:
    name: Home Assistant tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - name: Run Home Assistant tests with coverage
        run: |
          python -m pytest \
            --cov=custom_components/webasto_cool_top_trail \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-fail-under=90
      - name: SonarQube Cloud analysis
        # Dependabot-triggered runs cannot access the Actions SONAR_TOKEN secret.
        # Maintainer updates run PR analysis; pushes to main always run analysis.
        if: github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  esphome:
    name: ESPHome validation and bridge build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - run: python -m pip install esphome==2026.9.1
      - name: Validate ESPHome YAML without contacting devices
        run: |
          # Placeholder secrets for validation only.
          for dir in esp32 captures/baseline; do
            printf '%s\n' \
              'wifi_ssid: "example"' 'wifi_password: "example-password"' \
              'caravan_wifi_ssid: "example"' 'caravan_wifi_password: "example-password"' \
              'iot_wifi_ssid: "example"' 'iot_wifi_password: "example-password"' \
              'api_encryption_key: "AQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQE="' \
              > "$dir/secrets.yaml"
          done
          esphome config captures/baseline/baseline.yaml > /dev/null
          esphome config captures/capture-firmware.yaml > /dev/null
          esphome config esp32/example.yaml > /dev/null
      - name: Compile the example firmware (never upload)
        run: esphome compile esp32/example.yaml
