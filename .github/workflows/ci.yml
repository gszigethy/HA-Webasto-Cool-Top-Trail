name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and formatting
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
      - run: python -m pip install ruff==0.17.0
      - run: ruff check .
      - run: ruff format --check .

  tests:
    name: Home Assistant tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - name: Run Home Assistant tests with coverage
        run: |
          python -m pytest \
            --cov=custom_components/webasto_cool_top_trail \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-fail-under=90
      - name: SonarQube Cloud analysis
        # Dependabot-triggered runs cannot access the Actions SONAR_TOKEN secret.
        # Maintainer updates run PR analysis; pushes to main always run analysis.
        if: github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  esphome:
    name: ESPHome validation and bridge build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
      - run: python -m pip install esphome==2026.9.1
      - name: Validate sanitized examples without contacting devices
        run: |
          cp esp32/secrets.example.yaml esp32/secrets.yaml
          esphome config esp32/baseline.yaml > /dev/null
          esphome config esp32/receiver.example.yaml > /dev/null
          esphome config esp32/bridge.example.yaml > /dev/null
      - name: Compile bridge firmware (never upload)
        run: esphome compile esp32/bridge.example.yaml
