[project]
name = "ha-webasto-cool-top-trail"
version = "1.0.2"
description = "Home Assistant climate integration for Webasto Cool Top Trail via ESPHome IR"
requires-python = ">=3.14.2"

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--strict-markers --strict-config --disable-socket --allow-unix-socket"
