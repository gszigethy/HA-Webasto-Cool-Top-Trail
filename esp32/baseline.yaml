# Sanitized user-provided baseline; control logic and raw timings preserved.
# Network examples must be adapted before deployment. This file is not flashed by CI.
esphome:
  name: webasto-baseline
  friendly_name: Webasto baseline
  min_version: 2024.11.0
  name_add_mac_suffix: false

esp32:
  board: esp32dev
  framework:
    type: esp-idf

# Enable logging
logger:
  level: WARN

# Enable Home Assistant API
api:
  encryption:
    key: !secret api_encryption_key

# Allow Over-The-Air updates
ota:
- platform: esphome


wifi:
  networks:
    - ssid: !secret caravan_wifi_ssid
      password: !secret caravan_wifi_password
    - ssid: !secret iot_wifi_ssid
      password: !secret iot_wifi_password
  reboot_timeout: 5min
  domain: .example.invalid
  use_address: 192.0.2.12

#captive_portal:

web_server:
  port: 80

mdns:
  disabled: true

globals:
  - id: ac_mode_global
    type: std::string
    restore_value: no
    initial_value: '"Off"'

remote_transmitter:
  - id: transmitter_ir
    pin: GPIO2
    carrier_duty_percent: 50%
    non_blocking: true
  - id: transmitter_rf
    pin: GPIO22
    carrier_duty_percent: 50%
    non_blocking: true

#remote_receiver:
  # see https://esphome.io/components/remote_transmitter.html#setting-up-infrared-devices
  # for details on discovering the correct codes for your devices
#  - id: receiver_ir
#    pin:
#      number: GPIO23
#      inverted: true
    #dump: raw
#    idle: 100ms
#    buffer_size: 64kb

  # see https://esphome.io/components/remote_transmitter.html#setting-up-rf-devices
  # for details on discovering the correct codes for your devices
#  - id: receiver_rf
#    pin:
#      number: GPIO13
#    #dump: all
#    # Settings to optimize recognition of RF devices
#    tolerance: 50%
#    filter: 250us
#    idle: 4ms
#    buffer_size: 2kb

