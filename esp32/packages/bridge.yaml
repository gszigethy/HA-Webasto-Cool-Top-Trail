# Shared transmitter transport; downloaded automatically by ESPHome.
substitutions:
  webasto_repository: https://github.com/gszigethy/HA-Webasto-Cool-Top-Trail
  webasto_ref: main
  transmitter_pin: GPIO26

esphome:
  min_version: 2026.9.1

external_components:
  - source:
      type: git
      url: ${webasto_repository}
      ref: ${webasto_ref}
    components: [webasto_ir]
    refresh: 1d

webasto_ir:

api:
  # The caravan bridge may run without Home Assistant connected, so it must not reboot every 15 minutes.
  reboot_timeout: 0s
  actions:
    - action: send_frame
      variables:
        frame: string
      then:
        - if:
            condition:
              lambda: |-
                webasto_ir::Frame bytes;
                return webasto_ir::parse(frame, bytes);
            then:
              - lambda: |-
                  webasto_ir::Frame bytes;
                  webasto_ir::parse(frame, bytes);
                  auto call = id(transmitter_ir).transmit();
                  call.get_data()->set_data(webasto_ir::encode(bytes));
                  call.get_data()->set_carrier_frequency(38000);
                  call.perform();
              # Longest frame is 251ms; acknowledge after the RMT completion callback.
              - delay: 300ms
              - if:
                  condition:
                    lambda: |-
                      return !id(transmitter_ir).is_failed() &&
                             !id(transmitter_ir).status_has_warning();
                  then:
                    - lambda: |-
                        webasto_ir::Frame bytes;
                        webasto_ir::parse(frame, bytes);
                        id(transmitted_frame).publish_state(webasto_ir::format(bytes));
              - api.respond:
                  success: !lambda |-
                    return !id(transmitter_ir).is_failed() &&
                           !id(transmitter_ir).status_has_warning();
                  error_message: "IR transmitter reported an error"
            else:
              - api.respond:
                  success: false
                  error_message: "Invalid CARRIER_AC128 frame"

# Keep this name: Home Assistant discovers the transport on the device.
text_sensor:
  - platform: template
    id: transmitted_frame
    name: Transmitted IR frame
    entity_category: diagnostic
    update_interval: never

remote_transmitter:
  id: transmitter_ir
  pin: ${transmitter_pin}
  carrier_duty_percent: 50%
  non_blocking: true
