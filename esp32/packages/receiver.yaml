# Optional receiver. Include alongside bridge.yaml when an IR receiver is fitted.
substitutions:
  receiver_pin: GPIO32

text_sensor:
  - platform: template
    id: received_frame
    name: Received IR frame
    entity_category: diagnostic
    update_interval: never

remote_receiver:
  id: receiver_ir
  pin:
    number: ${receiver_pin}
    inverted: true
  idle: 30ms
  buffer_size: 64kb
  filter: 50us
  tolerance: 25%
  on_raw:
    then:
      - lambda: |-
          webasto_ir::Frame bytes;
          if (webasto_ir::decode(x, bytes))
            id(received_frame).publish_state(webasto_ir::format(bytes));

