# M5Stack capture device: ESP32-PICO-D4, 4 MB flash, RX GPIO32 / TX GPIO26.
# Paste into ESPHome Device Builder. No companion header file is needed.
substitutions:
  device_name: webasto-ir-bridge
  friendly_name: Webasto IR Bridge
  transmitter_pin: GPIO26
  receiver_pin: GPIO32
  # Package support was added after beta 1. Use main until a newer release includes it.
  webasto_ref: main

packages:
  webasto:
    url: https://github.com/gszigethy/HA-Webasto-Cool-Top-Trail
    ref: ${webasto_ref}
    files:
      - esp32/packages/bridge.yaml
      - esp32/packages/receiver.yaml  # Remove this line for transmitter-only hardware.
    refresh: 1d

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}

esp32:
  # This board configuration also compiled for the ESP32-PICO-D4 capture device.
  board: esp32dev
  flash_size: 4MB
  framework:
    type: esp-idf

wifi:
  ssid: !secret caravan_wifi_ssid
  password: !secret caravan_wifi_password

api:
  encryption:
    key: !secret api_encryption_key

logger:
  level: INFO

ota:
  - platform: esphome
